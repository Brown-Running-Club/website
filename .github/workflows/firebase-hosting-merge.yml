# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BROWN_RUNNING_CLUB }}"
          channelId: live
          projectId: brown-running-club
          # Pinned: firebase-tools 15.34.1+ checks the Service Usage API before
          # deploying, which the deploy service account lacks permission for
          # (serviceusage.services.get). Unpin after granting it the
          # "Service Usage Consumer" role in Google Cloud IAM.
          firebaseToolsVersion: 15.34.0
